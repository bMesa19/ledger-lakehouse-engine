services:
  postgres-ledger:
    image: postgres:16-alpine
    container_name: ledger-postgres-16
    shm_size: '1gb'
    environment:
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: ledger_secret_pass
      POSTGRES_DB: core_ledger
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
    volumes:
      - postgres_ledger_data:/var/lib/postgresql/data
      - ../layer1_oltp_warehouse/postgres_schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_admin -d core_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: ledger-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: file:///Users/brayan/ledger-lakehouse-engine/lakehouse-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.io.ResolvingFileIO
    volumes:
      - /Users/brayan/ledger-lakehouse-engine/lakehouse-warehouse:/Users/brayan/ledger-lakehouse-engine/lakehouse-warehouse

volumes:
  postgres_ledger_data:
