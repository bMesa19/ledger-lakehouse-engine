version: 2

models:
  - name: dim_accounts
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: account_code
        tests:
          - unique
          - not_null

  - name: fact_journal_lines
    columns:
      - name: line_id
        tests:
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
